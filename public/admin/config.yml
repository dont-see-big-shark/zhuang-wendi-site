# Sveltia CMS 配置（兼容 Decap 格式）

backend:
  name: github
  repo: dont-see-big-shark/zhuang-wendi-site
  branch: main
  # OAuth 代理（Cloudflare Worker）— 后台 GitHub 登录使用。
  # Worker 的允许域名列表必须包含 zhuang-wendi-site.vercel.app。
  base_url: https://sveltia-cms-auth.weelgod-39e.workers.dev

# local_backend 仅用于本地开发（无需 GitHub 登录直接读写本地文件夹），线上自动忽略。
local_backend: true

# 上传图片时先在浏览器里压缩转换；仓库只保留转换后的版本，不存原图。
# （提交后再压缩无法缩小 git 历史，所以必须在入库前完成。）
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400

media_folder: "src/assets"
public_folder: "/src/assets"

collections:
  - name: works
    label: 作品
    label_singular: 作品
    folder: "src/content/works"
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: year, label: 年份, widget: string, required: false }
      - { name: order, label: "显示顺序（数字越小越靠前）", widget: number, value_type: int, default: 0, required: false }
      - name: photos
        label: "照片（可多张上传，拖拽调整顺序）"
        widget: list
        required: false
        field: { name: image, label: 图片, widget: image, media_folder: "/src/assets/works/{{slug}}", public_folder: "/src/assets/works/{{slug}}" }
      - { name: hidden, label: 隐藏（不在前台显示）, widget: boolean, default: false, required: false }
      - { name: body, label: "文字说明（显示在作品页，支持 Markdown）", widget: markdown, required: false }

  - name: settings
    label: 站点信息
    files:
      - name: about
        label: 简介 / 联系方式
        file: "src/data/about.json"
        fields:
          - { name: name, label: 姓名, widget: string }
          - { name: bio, label: 个人简介, widget: text, required: false }
          - { name: birth, label: "出生年份（留空则不在前台显示）", widget: string, required: false }
          - name: cv
            label: 履历（一行一条，留空则不显示）
            widget: list
            required: false
            field: { name: item, label: 条目, widget: string }
          - { name: email, label: "邮箱（留空则不显示）", widget: string, required: false }
          - { name: instagram, label: "Instagram 链接（留空则不显示）", widget: string, required: false }
          - { name: instagramHandle, label: Instagram 显示名, widget: string, required: false }
